[project]
name = "bmab-scripts"
version = "0.1.0"
description = "Beat Me at Boggle: word list build, data viz, generator research (python side)"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11",
    "numpy>=2",
    "pandas>=3",
    "geopandas>=1.1",
    "geodatasets>=2026.5",
    "timezonefinder>=8",
    "countrystatecity-countries>=1.0",
    "asciibars>=0.0.3",
    "pillow>=11",
    "wordfreq>=3.1",
    "scipy>=1.14",
]

[tool.uv]
package = false
